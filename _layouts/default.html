<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.url %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="site-desc">{{ site.description }}</span>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} {{ site.author }}</span>
    <span class="sep">·</span>
    <a href="https://github.com/shengbinxu">GitHub</a>
    <span class="sep">·</span>
    <a href="{{ '/feed.xml' | relative_url }}">订阅</a>
  </footer>
</body>
</html>
