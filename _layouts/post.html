---
layout: default
---
<div class="layout">

  <aside class="toc card" id="toc" hidden>
    <div class="toc-title">目录</div>
    <ul id="toc-list"></ul>
  </aside>

  <div class="layout-main">
    <article class="card article-card">

      <header class="article-head">
        <h1 class="article-title">{{ page.title }}</h1>
        <div class="article-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %-m 月 %-d 日" }}</time>
          {% if page.tags and page.tags.size > 0 %}
            <span class="tag-row">
              {% for tag in page.tags %}<a class="tag" href="{{ '/' | relative_url }}?tag={{ tag | url_encode }}">{{ tag }}</a>{% endfor %}
            </span>
          {% endif %}
        </div>
      </header>

      <div class="prose" id="article-body">
        {{ content }}
      </div>

    </article>
  </div>

</div>
