---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %-m 月 %-d 日" }}</time>
      {% if page.tags and page.tags.size > 0 %}
        <span class="sep">·</span>
        <span class="tags">
          {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
        </span>
      {% endif %}
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>

<nav class="post-nav">
  <a href="{{ '/' | relative_url }}">← 返回目录</a>
</nav>
