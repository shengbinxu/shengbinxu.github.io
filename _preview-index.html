<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/600.css">
<style>/* ==========================================================================
   版式参考：yinwang.org（王垠博客）
   设计要点：暖白底 + 白卡、18px/1.78 正文、704px 阅读宽度、琥珀棕主题色、
             H2 用主题色、目录左侧吸顶、标签胶囊
   ========================================================================== */

:root {
  /* 琥珀棕主题色阶（对应原站 --theme-*） */
  --theme-50:  252 249 242;
  --theme-100: 247 240 223;
  --theme-200: 239 227 195;
  --theme-300: 228 207 154;
  --theme-400: 218 181 128;
  --theme-500: 212 165 116;
  --theme-600: 189 142 93;
  --theme-700: 165 118 71;
  --theme-800: 139 93 50;
  --theme-900: 111 70 32;

  --bg:        rgb(var(--theme-50));
  --card:      #ffffff;
  --fg:        #111827;
  --fg-body:   #374151;
  --muted:     #6b7280;
  --border:    rgb(0 0 0 / 0.07);
  --link:      rgb(var(--theme-600));
  --link-hover:rgb(var(--theme-700));
  --heading-accent: rgb(var(--theme-600));
  --tag-bg:    rgb(var(--theme-100));
  --tag-fg:    rgb(var(--theme-800));
  --code-bg:   #0d1117;
  --code-fg:   #e6edf3;
  --inline-code-bg: rgb(0 0 0 / 0.055);
  --inline-code-fg: rgb(var(--theme-800));
  --shadow:    0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px -8px rgb(111 70 32 / 0.12);

  --measure:   704px;   /* 正文阅读宽度 */
  --card-pad-x: 44px;   /* 文章卡片横向内边距；表格外扩量与之绑定 */
  --toc-width: 200px;
  --radius:    10px;

  /* 字体：完全沿用 yinwang.org —— 纯系统字体，不加载任何 webfont */
  --font-sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
               "Segoe UI Emoji", Segoe UI Symbol, "Noto Color Emoji";
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
               "Liberation Mono", "Courier New", monospace;
  --font-ui:   var(--font-sans);
  --font-body: var(--font-sans);
}

html.dark {
  --bg:        #111827;
  --card:      #1b2230;
  --fg:        #f3f4f6;
  --fg-body:   #d1d5db;
  --muted:     #9ca3af;
  --border:    rgb(255 255 255 / 0.09);
  --link:      rgb(var(--theme-400));
  --link-hover:rgb(var(--theme-300));
  --heading-accent: rgb(var(--theme-400));
  --tag-bg:    rgb(var(--theme-900) / 0.45);
  --tag-fg:    rgb(var(--theme-300));
  --inline-code-bg: rgb(255 255 255 / 0.09);
  --inline-code-fg: rgb(var(--theme-300));
  --shadow:    0 1px 2px rgb(0 0 0 / 0.3), 0 4px 20px -10px rgb(0 0 0 / 0.5);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg-body);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-autospace: normal;
}

/* ---------------------------------------------------------------- 顶部导航 */

.site-nav {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: saturate(180%) blur(8px);
}

.site-nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.site-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  text-decoration: none;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.site-title:hover { color: var(--link); }

.nav-links {
  display: flex;
  gap: 22px;
  font-size: 15px;
  font-weight: 500;
}

.nav-links a {
  color: var(--fg);
  text-decoration: none;
}

.nav-links a:hover { color: var(--link); }

.nav-spacer { flex: 1; }

.theme-toggle {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--fg-body);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

.theme-toggle:hover { color: var(--link); border-color: var(--link); }

/* ------------------------------------------------------------------ 布局 */

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 24px 72px;
}

.layout {
  display: flex;
  gap: 32px;
  align-items: flex-start;
}

.layout-main { flex: 1; min-width: 0; max-width: calc(var(--measure) + 88px); }

/* ------------------------------------------------------------------ 卡片 */

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* -------------------------------------------------------------- 首页列表 */

.page-title {
  font-size: 36px;
  line-height: 1.11;
  font-weight: 800;
  color: var(--fg);
  margin: 0 0 12px;
  letter-spacing: -0.02em;
}

.page-intro {
  color: var(--muted);
  font-size: 16px;
  margin: 0 0 32px;
}

.post-list { list-style: none; margin: 0; padding: 0; }

.post-item { margin-bottom: 40px; }

.post-item-title {
  font-size: 24px;
  line-height: 1.33;
  font-weight: 700;
  color: var(--fg);
  text-decoration: none;
  display: inline-block;
}

.post-item-title:hover { color: var(--link); }

.post-item-desc {
  color: var(--muted);
  font-size: 16px;
  margin: 8px 0 10px;
}

.post-item-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--muted);
}

/* ---------------------------------------------------------------- 标签 */

.tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--tag-bg);
  color: var(--tag-fg);
  font-size: 13px;
  line-height: 1.5;
  text-decoration: none;
}

/* ------------------------------------------------------------- 文章正文 */

.article-head { margin-bottom: 24px; }

.article-title {
  font-family: var(--font-body);
  font-size: 36px;
  line-height: 1.11;
  font-weight: 800;
  color: var(--fg);
  margin: 0 0 16px;
  letter-spacing: -0.02em;
}

.article-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--muted);
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.article-meta .tag-row {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.prose {
  /* 注意：这里不设 max-width。改用「子元素限宽」的方式，
     让段落保持 704px 阅读宽度，而表格能用满卡片宽度——
     否则宽表格会被 704px 挤到溢出裁切。 */
  max-width: none;
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.78;
  color: var(--fg-body);
}

.prose > * { max-width: var(--measure); }

/* 表格与代码块不参与限宽，可用满卡片 */
.prose > table {
  /* 表格吃掉卡片左右内边距，比正文宽 2×内边距，减少长路径被从中间劈开。
     外扩量必须与 --card-pad-x 绑定，否则窄屏下会把页面撑出横向滚动。 */
  width: calc(100% + 2 * var(--card-pad-x));
  margin-left: calc(-1 * var(--card-pad-x));
  max-width: none;
  font-size: 0.84em;
}
.prose > pre { max-width: 100%; }

.prose p { margin: 24px 0; }

.prose a {
  color: var(--link);
  text-decoration: none;
  font-weight: 600;
}

.prose a:hover { color: var(--link-hover); text-decoration: underline; }

.prose h1, .prose h2, .prose h3, .prose h4 {
  color: var(--fg);
  line-height: 1.33;
  scroll-margin-top: 80px;
  /* 与正文同族（宋体）：内容层统一，避免目录/标题/正文三种字体并置 */
  font-family: var(--font-body);
}

.prose h2 {
  font-size: 24px;
  font-weight: 700;
  color: var(--heading-accent);
  margin: 48px 0 20px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.prose h3 {
  font-size: 20px;
  font-weight: 600;
  margin: 36px 0 14px;
}

.prose h4 {
  font-size: 18px;
  font-weight: 600;
  margin: 28px 0 12px;
}

.prose strong { color: var(--fg); font-weight: 600; }

.prose ul, .prose ol { margin: 24px 0; padding-left: 1.6em; }

.prose li { margin: 8px 0; }

.prose li > p { margin: 12px 0; }

.prose blockquote {
  margin: 24px 0;
  padding: 4px 0 4px 20px;
  border-left: 3px solid rgb(var(--theme-300));
  color: var(--muted);
}

.prose blockquote p:first-child { margin-top: 0; }
.prose blockquote p:last-child { margin-bottom: 0; }

.prose hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 48px 0;
}

/* 代码：浅色模式下也用深底，与原站一致 */
.prose code {
  font-family: var(--font-mono);
  font-size: 0.875em;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--inline-code-bg);
  color: var(--inline-code-fg);
  font-weight: 600;
}

.prose pre {
  margin: 28px 0;
  padding: 18px 20px;
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-fg);
  overflow-x: auto;
  font-size: 0.875em;
  line-height: 1.7;
}

.prose pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-weight: 400;
  font-size: inherit;
}

.prose table {
  border-collapse: collapse;
  box-sizing: border-box;
  line-height: 1.7;
  display: block;
  overflow-x: auto;
}

.prose table thead { border-bottom: 1px solid var(--border); }

.prose table th {
  color: var(--fg);
  font-weight: 600;
  text-align: left;
  padding: 10px 14px 10px 0;
  white-space: nowrap;
}

.prose table td {
  padding: 10px 14px 10px 0;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.prose img { max-width: 100%; height: auto; margin: 28px 0; border-radius: 6px; }

/* ------------------------------------------------------------ 目录侧栏 */

.toc {
  font-family: var(--font-body);
  width: var(--toc-width);
  flex-shrink: 0;
  position: sticky;
  top: 88px;
  padding: 18px 20px;
  font-size: 14px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}

.toc-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  margin: 0 0 10px;
}

.toc ul { list-style: none; margin: 0; padding: 0; }

.toc li { margin: 7px 0; line-height: 1.5; }

.toc a {
  color: var(--muted);
  text-decoration: none;
  display: block;
}

.toc a:hover { color: var(--link); }

.toc a.active { color: var(--link); font-weight: 600; }

.toc .toc-l3 a { padding-left: 14px; font-size: 13px; }

/* ------------------------------------------------------------------ 页脚 */

.site-footer {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 14px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.site-footer a { color: var(--muted); text-decoration: none; }
.site-footer a:hover { color: var(--link); }

/* ------------------------------------------------------------ 响应式 */

@media (max-width: 900px) {
  .toc { display: none; }
  .article-title, .page-title { font-size: 28px; }
  .prose { font-size: 17px; }
  .prose h2 { font-size: 21px; }
}

@media (max-width: 600px) {
  .wrap { padding: 20px 16px 56px; }
  .site-nav-inner { padding: 12px 16px; gap: 16px; }
  .site-title { font-size: 18px; }
  .nav-links { gap: 14px; font-size: 14px; }
  .article-title, .page-title { font-size: 24px; }
  .post-item-title { font-size: 20px; }
  .prose { font-size: 16px; line-height: 1.75; }
  .prose p { margin: 20px 0; }
  .article-meta .tag-row { margin-left: 0; width: 100%; }
}

/* -------------------------------------------------- 代码高亮（Rouge 映射到 github-dark） */

.highlight .c, .highlight .cm, .highlight .c1 { color: #8b949e; font-style: italic; }
.highlight .k, .highlight .kd, .highlight .kn, .highlight .kc, .highlight .kr { color: #ff7b72; }
.highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .sc { color: #a5d6ff; }
.highlight .mi, .highlight .mf, .highlight .m { color: #79c0ff; }
.highlight .nf, .highlight .fm { color: #d2a8ff; }
.highlight .nx, .highlight .nb { color: #ffa657; }
.highlight .o, .highlight .ow { color: #ff7b72; }
.highlight .nt { color: #7ee787; }
.highlight .err { color: inherit; background: none; }

/* 文章卡片内边距 */
.article-card { padding: 40px var(--card-pad-x) 48px; }

@media (max-width: 600px) {
  :root { --card-pad-x: 18px; }
  .article-card { padding: 24px var(--card-pad-x) 32px; }
}

/* ------------------------------------------------- 首页：筛选与排序 */

.filters {
  padding: 22px 26px;
  margin-bottom: 40px;
}

.filter-row { display: flex; align-items: flex-start; gap: 16px; }
.filter-row + .filter-row { margin-top: 18px; }

.filter-label {
  flex-shrink: 0;
  width: 84px;
  padding-top: 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
}

.filter-select {
  font-family: var(--font-ui);
  font-size: 15px;
  color: var(--fg-body);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  min-width: 180px;
  cursor: pointer;
}

.filter-select:hover { border-color: var(--link); }

.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; }

/* 标签同时用于 <a>（文章元信息）和 <button>（筛选器），统一外观 */
.tag-btn {
  font-family: var(--font-ui);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}

.tag-btn:hover {
  background: rgb(var(--theme-200));
  color: rgb(var(--theme-900));
}

.tag-btn.active {
  background: rgb(var(--theme-600));
  color: #fff;
  border-color: rgb(var(--theme-600));
}

html.dark .tag-btn:hover { background: rgb(var(--theme-800)); color: rgb(var(--theme-100)); }
html.dark .tag-btn.active { background: rgb(var(--theme-400)); color: #1b2230; border-color: rgb(var(--theme-400)); }

.filter-empty { color: var(--muted); font-size: 15px; padding: 12px 0; }

@media (max-width: 600px) {
  .filters { padding: 16px 18px; }
  .filter-row { flex-direction: column; gap: 8px; }
  .filter-label { width: auto; padding-top: 0; }
  .filter-select { width: 100%; }
}

/* 表格单元格内允许长串在必要时断行。
   否则 viking://user/default/resources/nanobot 这类长路径会把表格
   的最小宽度撑到 800px 以上，逼出横向滚动条。
   用 anywhere 而非 break-word：只有 anywhere 会影响 min-content 计算。 */
.prose table th,
.prose table td { overflow-wrap: anywhere; }

.prose table code { overflow-wrap: anywhere; }
</style></head><body><nav class="site-nav"><div class="site-nav-inner">

<script>// 主题切换
(function () {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  var root = document.documentElement;

  function sync() {
    btn.textContent = root.classList.contains('dark') ? '浅色' : '深色';
  }
  sync();

  btn.addEventListener('click', function () {
    root.classList.toggle('dark');
    try { localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    sync();
  });
})();

// 目录：扫描正文 h2/h3 生成，并随滚动高亮
(function () {
  var toc = document.getElementById('toc');
  var list = document.getElementById('toc-list');
  var body = document.getElementById('article-body');
  if (!toc || !list || !body) return;

  var heads = [].slice.call(body.querySelectorAll('h2'));
  if (heads.length < 2) return;

  var used = {};
  heads.forEach(function (h) {
    // 生成稳定锚点
    var id = h.id;
    if (!id) {
      id = h.textContent.trim()
        .replace(/[^\w\u4e00-\u9fa5]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .toLowerCase() || 'section';
      var base = id, n = 2;
      while (used[id] || document.getElementById(id)) { id = base + '-' + n++; }
      h.id = id;
    }
    used[id] = true;

    var li = document.createElement('li');
    if (h.tagName === 'H3') li.className = 'toc-l3';
    var a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent.trim();
    li.appendChild(a);
    list.appendChild(li);
  });

  toc.hidden = false;

  var links = [].slice.call(list.querySelectorAll('a'));
  var targets = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });

  function highlight() {
    var y = window.scrollY + 120;
    var idx = 0;
    for (var i = 0; i < targets.length; i++) {
      if (targets[i] && targets[i].offsetTop <= y) idx = i;
    }
    links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
  }

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { highlight(); ticking = false; });
  }, { passive: true });

  highlight();
})();

// 首页：标签筛选 + 排序
(function () {
  var list = document.getElementById('post-list');
  var cloud = document.getElementById('tag-cloud');
  var sortSel = document.getElementById('sort-select');
  var empty = document.getElementById('filter-empty');
  if (!list) return;

  var items = [].slice.call(list.querySelectorAll('.post-item'));

  // 每篇文章的标签
  items.forEach(function (li) {
    var raw = (li.getAttribute('data-tags') || '').trim();
    li._tags = raw ? raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
    li._date = li.getAttribute('data-date') || '';
    li._title = li.getAttribute('data-title') || '';
  });

  // ---------- 排序 ----------
  function applySort(mode) {
    var sorted = items.slice();
    sorted.sort(function (a, b) {
      if (mode === 'title') return a._title.localeCompare(b._title, 'zh-Hans-CN');
      var da = Date.parse(a._date) || 0, db = Date.parse(b._date) || 0;
      return mode === 'old' ? da - db : db - da;
    });
    sorted.forEach(function (li) { list.appendChild(li); });
  }

  if (sortSel) {
    sortSel.addEventListener('change', function () { applySort(sortSel.value); });
  }

  // ---------- 标签云（从文章列表统计，无需服务端插件）----------
  var counts = {};
  items.forEach(function (li) {
    li._tags.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
  });

  var tags = Object.keys(counts).sort(function (a, b) {
    return counts[b] - counts[a] || a.localeCompare(b, 'zh-Hans-CN');
  });

  var current = null;

  function renderCloud() {
    if (!cloud) return;
    cloud.innerHTML = '';
    var all = document.createElement('button');
    all.type = 'button';
    all.className = 'tag tag-btn' + (current === null ? ' active' : '');
    all.textContent = '全部 (' + items.length + ')';
    all.addEventListener('click', function () { select(null, true); });
    cloud.appendChild(all);

    tags.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tag tag-btn' + (current === t ? ' active' : '');
      b.textContent = t + ' (' + counts[t] + ')';
      b.addEventListener('click', function () { select(t, true); });
      cloud.appendChild(b);
    });
  }

  // ---------- 筛选 ----------
  function select(tag, pushUrl) {
    current = tag;
    var shown = 0;
    items.forEach(function (li) {
      var hit = tag === null || li._tags.indexOf(tag) !== -1;
      li.hidden = !hit;
      if (hit) shown++;
    });
    if (empty) empty.hidden = shown !== 0;
    renderCloud();
    if (pushUrl && window.history && window.history.replaceState) {
      var url = location.pathname + (tag === null ? '' : '?tag=' + encodeURIComponent(tag));
      window.history.replaceState(null, '', url);
    }
  }

  // ---------- 初始化：读 URL 上的 ?tag= ----------
  var m = location.search.match(/[?&]tag=([^&]*)/);
  var initial = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  if (initial && tags.indexOf(initial) === -1) initial = null;
  select(initial, false);
  applySort(sortSel ? sortSel.value : 'new');
})();
</script></body></html>
